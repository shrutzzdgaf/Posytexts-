[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/open/*"
  to = "/?id=:splat"
  status = 302

[[redirects]]
  from = "/p/*"
  to = "/?id=:splat"
  status = 302
